# BusChain Control: Super+Q / window close → soft close (CancelClose + tray withdraw).
# --hidden starts with no window (tray only); Show creates the UI. Avoid forcekill.

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# custom binds

# screenshot utils
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# system essentials
# Power menu — Quickshell (fallback: wlogout)
bind = $mainMod, O, exec, qs ipc call power toggle
# Notifications drawer — Quickshell
bind = $mainMod, N, exec, qs ipc call notifs toggle
# bind = $mainMod, O, exec, wlogout
#bind = $mainMod, S, exec, hyprctl keyword monitor "DP-1, 5120x1440@239.58, 0x0, 1, bitdepth, 8, vrr, 1" && hyprctl keyword monitor "DP-2, 1920x1080@60.00000, 1600x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60.00000, 5120x-120, 1, transform, 1"
#bind = $mainMod, S, exec, hyprctl keyword monitor "DP-1, 5120x1440@60, 0x0, 1, bitdepth, 8" && hyprctl keyword monitor "DP-2, 1920x1080@60, 1600x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60, 5120x-120, 1, transform, 1"
#bind = $mainMod, D, exec, hyprctl keyword monitor "DP-1, 2560x1440@120, 0x0, 1, bitdepth, 8" && hyprctl keyword monitor "DP-2, 1920x1080@60, 320x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60, 2560x0, 1, transform, 1"

bind = $mainMod, SPACE, exec, qs ipc call launcher toggle
bind = $mainMod, period, exec, qs ipc call emoji toggle
# Legacy: wofi --show drun / wofi-emoji

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, bash -lc kitty
bind = $mainMod, Q, killactive, 
bind = $mainMod, N, exec, codium ~/myprojects/teonix-unstable/ && codium ~/.config/
#bind = $mainMod, M, exec, 
#bind = $mainMod, V, togglefloating, 
bind = $mainMod, C, exec, hyprctl dispatch togglefloating && hyprctl dispatch centerwindow
bind = $mainMod, P, pin
#bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod SHIFT, F, exec, hyprctl dispatch fullscreen

# Scrolling layout: swap active window's column with neighbor right/left
bind = $mainMod, TAB, layoutmsg, swapcol r
bind = $mainMod SHIFT, TAB, layoutmsg, swapcol l
bind = $mainMod, grave, exec, sh ~/.config/hypr/cyclemon.sh

bind = $mainMod ALT, C, exec, mpv av://v4l2:/dev/video1

#bind = $mainMod, S, exec, hyprctl keyword input:kb_layout se
#bind = $mainMod, A, exec, hyprctl keyword input:kb_layout us

# Move focus with mainMod + arrow keys (layoutmsg focus for scrolling layout; works in-column and wraps)
bind = $mainMod, left, layoutmsg, focus l
bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, up, layoutmsg, focus u
bind = $mainMod, down, layoutmsg, focus d

bind = $mainMod ALT, a, layoutmsg, focus l
bind = $mainMod ALT, d, layoutmsg, focus r
bind = $mainMod ALT, w, layoutmsg, focus u
bind = $mainMod ALT, s, layoutmsg, focus d

bind = $mainMod, b, exec, blueman-manager
# looking-glass-client not used on MacBook
# bind = $mainMod, v, exec, looking-glass-client -m KEY_GRAVE

# Mullvad: Super+u disconnect | Super+i Stockholm | Super+Shift+i US
bind = $mainMod, u, exec, mullvad disconnect
bind = $mainMod, i, exec, mullvad relay set location se sto && mullvad connect
bind = $mainMod SHIFT, i, exec, mullvad relay set location us && mullvad connect

#bind = $mainMod, D, exec, ~/.config/hypr/dragonscripts/dragon-source.sh
#bind = $mainMod SHIFT, D, exec, ~/.config/hypr/dragonscripts/dragon-target.sh

# Switch workspaces with mainMod + [0-9]
