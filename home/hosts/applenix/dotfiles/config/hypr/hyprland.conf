bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, Z, workspace, 11
bind = $mainMod, X, workspace, 12
bind = $mainMod, A, workspace, 13
bind = $mainMod, G, workspace, 14
bind = $mainMod, W, workspace, 15
bind = $mainMod, E, workspace, 16
bind = $mainMod, R, workspace, 17

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, Z, movetoworkspace, 11
bind = $mainMod SHIFT, X, movetoworkspace, 12
bind = $mainMod SHIFT, A, movetoworkspace, 13
bind = $mainMod SHIFT, G, movetoworkspace, 14
bind = $mainMod SHIFT, W, movetoworkspace, 15
bind = $mainMod SHIFT, E, movetoworkspace, 16
bind = $mainMod SHIFT, R, movetoworkspace, 17

#bind = $mainMod, mouse_up, layoutmsg, focus l
#bind = $mainMod, mouse_down, layoutmsg, focus r

# Scrolling layout: mainMod + scroll up/down = focus right/left (up = ascending = right)
bind = $mainMod, mouse:275, layoutmsg, focus l
bind = $mainMod, mouse:276, layoutmsg, focus r
# Scrolling layout: mainMod+Shift+mouse:276 = promote window to own column
bind = $mainMod SHIFT, mouse:276, layoutmsg, promote
# Workspace: mainMod + mouse back/forward — per-monitor only (DP-1: 1–15, DP-2: 16–17)
# Scroll up = higher workspace (1→2), scroll down = lower
bind = $mainMod, mouse_up, workspace, m+1
bind = $mainMod, mouse_down, workspace, m-1

# Scrolling layout keyboard: mainMod + comma/period = -col/+col
#bind = $mainMod, comma, layoutmsg, focus l
#bind = $mainMod, period, layoutmsg, focus r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = ,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioPlay, exec, playerctl play-pause
