#monitor = HDMI-A-1, 1920x1080@60.00000, 1600x-1080, 1, bitdepth,10
#monitor = DP-1, 5120x1440@239.63, 0x0, 1, vrr, 1
#monitor = DP-1, 5120x1440@239.63, 0x0, 1, bitdepth, 10, vrr, 1

