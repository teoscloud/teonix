# hyprland.conf
# source ~/.config/hypr/monitor.conf
#monitor = DP-1, 5120x1440@239.58, 0x0, 1, bitdepth, 8, vrr, 1
#start with ultrawide
#monitor = DP-1, 5120x1440@60, 0x0, 1, bitdepth, 8
#monitor = DP-2, 1920x1080@60, 1600x-1080, 1, bitdepth, 8
#monitor = HDMI-A-2, 1920x1080@60, 5120x-120, 1, transform, 1
#startwithnormal
# Let Asahi pick a mode the panel actually advertises. A hardcoded
# 2560x1600@60 makes Hyprland exit before the first frame on many Macs
# (14"/16" panels, or DCP rejecting the mode) → instant return to SDDM.
# 1.5 = 150%; Hyprland snaps to 1.6 so 2560×1600 → integer logical pixels
# (1600×1000). Externals stay at 1 via the catch-all below.
monitor = eDP-1, preferred, auto, 1.5
monitor = , preferred, auto, 1

workspace = 1, monitor:eDP-1, default:true
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

# ... rest of your hyprland configuration ...

# Environment variables
env = NIXOS_OZONE_WL, 1
env = NIXPKGS_ALLOW_UNFREE, 1
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = GDK_BACKEND, wayland,x11
env = CLUTTER_BACKEND, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
#env = SDL_VIDEODRIVER, x11
#env = SDL_VIDEODRIVER, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = WLR_XCURSOR_SIZE, 24 # Added for Wayland cursor size
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, macOS
env = WLR_XCURSOR_THEME, macOS
env = QT_QPA_PLATFORM,wayland;xcb
# qt6ct was set without a config (and often without qt6ct installed) → Qt icon
# theme collapsed to "hicolor" only, so Quickshell showed magenta checkerboards
# for notifications/tray. Use "kde" to read ~/.config/kdeglobals [Icons].
env = QT_QPA_PLATFORMTHEME,kde
env = HYPRCURSOR_SIZE, 24

exec-once = hyprctl setcursor macOS 24

# Autostart applications
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Keep graphical-session.target up so xdg-desktop-portal (Requisite=) starts after nixos-rebuild
exec-once = systemctl --user start nixos-fake-graphical-session.target
# GNOME Keyring secret service (Mailspring, etc.) — not KWallet
exec-once = gnome-keyring-daemon --start
# Wallpaper: hyprpaper only (swww + hyprpaper together is redundant and extra compositor load)
# Shell rice — White Mainframe Quickshell (bar + dock + notifs + power).
# Quiet broken WhiteSur SVG paint warnings from tray icons (e.g. Obsidian)
exec-once = bash -lc 'env QT_LOGGING_RULES="qt.svg.warning=false" quickshell'
# GTK / portal light-dark follows last White/Charcoal (qs writes ~/.config/qs-mainframe-theme)
exec = bash ~/teonix/home/hosts/nixbox/dotfiles/config/quickshell-mainframe/scripts/qs-system-appearance.sh
# exec-once = waybar
# exec-once = swaync
# exec-once = ~/.config/nwg-dock-hyprland/launch.sh
# BusChain Control — standalone ~/Projects/buschain-control (cargo / nix develop)
# exec-once = buschain-control --hidden
exec-once = nm-applet --indicator
exec-once = lxqt-policykit-agent
exec-once = brightnessctl set 100%
exec-once = brightnessctl -d *::kbd_backlight set 100%
exec-once = gammastep -O 7500
exec-once = bash -lc hyprpaper
exec-once = bash -lc hypridle
# hyprlux: started by NixOS module (programs.hyprlux); do not exec-once here (double-start causes conflicts)
exec-once = blueman-applet &
# Mullvad GUI (tray) — daemon is system-wide via services.mullvad-vpn
exec-once = mullvad-vpn
exec-once = gsettings set org.gnome.desktop.wm.preferences audible-bell false
#exec-once = /usr/lib/polkit-kde-authentication-agent-1

exec-once = flatpak override --filesystem=~/.themes:ro --filesystem=~/.icons:ro --user

# Mainframe appearance owns gtk-theme / color-scheme (see qs-system-appearance.sh above).
#exec = gsettings set org.gnome.desktop.interface gtk-theme "WhiteSur-Dark"
#exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" 

#exec-once = corectrl

# hyprflow: restore best recent autosave (stale latest.json alone skips with --max-age).
# User apps below are restored from session — do not exec-once them or they launch twice.
exec-once = ~/.config/hypr/scripts/hyprflow-restore-on-login.sh

# udiskie: managed by Home Manager (tray=never); do NOT start here — tray popups crash Hyprland (CPopup::onCommit)
# exec-once = ~/.config/hypr/scripts/scrolling-promote-new-window.sh &  # disabled: promote via mainMod+Shift+mouse:276

# Disable middle-click paste
#bind = , mouse:274, exec, ;
#exec-once = wl-paste -p --watch wl-copy -p ''

ecosystem {
    no_update_news = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,se
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    mouse_refocus = false

    force_no_accel = true

    # Force discrete wheel notches (1 click → 1 axis event). Auto(1) can leave
    # hi-res SMOOTH deltas that Waybar coalesces into one on-scroll (missed %).
    # Not a Waybar fork — compositor input only. 0=off 1=auto 2=force.
    emulate_discrete_scroll = 2

    touchpad {
        disable_while_typing=1
        natural_scroll=1
        clickfinger_behavior=1
        middle_button_emulation=0
        tap-to-click=0
        scroll_factor=0.2

    }
    
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 12
    border_size = 1
    # White Mainframe defaults (qsglass restores the glass gradient)
    col.active_border = rgba(2a2e34ee) rgba(fffffff0) 45deg
    col.inactive_border = rgba(9aa0a8aa)

    layout = scrolling
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # Mainframe: 45° corner cuts (rounding_power 1), no blur/shadow.

    rounding = 9
    rounding_power = 1

    shadow {
        enabled = false
    }

    blur {
        enabled = false
        size = 4
        passes = 2
        xray = false
        ignore_opacity = false
        noise = 0.01
        contrast = 0.9
        brightness = 0.88
        vibrancy = 0.1
    }
}

# Single animations block (duplicate blocks are confusing and can behave unpredictably)
# Mainframe defaults (qsglass restores glass timings)
animations {
    enabled = yes
    bezier = mfEase, 0.16, 1, 0.3, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    animation = windowsIn, 1, 4, mfEase, popin 55%
    animation = windowsOut, 1, 3, mfEase, popin 55%
    animation = windows, 1, 4, mfEase, popin 55%
    animation = borderangle, 1, 22, linear, loop
    animation = border, 1, 4, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    #pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

scrolling {
    column_width = 0.66
    follow_focus = true
    follow_min_visible = 0
    focus_fit_method = 1
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
    smart_resizing = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = on
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Visible even if hyprpaper/quickshell never start (Fedora Hyprland
    # session has no Nix on PATH → otherwise a dead-looking black screen).
    background_color = rgb(1a1024)
}

xwayland {
  force_zero_scaling = true;
}

experimental {
    #xx_color_management_v4 = true;
    #wide_color_gamut = true;
    #hdr = true;
}

# Wallpaper configuration is handled by hyprpaper (see hyprpaper.conf)
# Hyprland no longer supports direct wallpaper configuration in this file
# Use hyprpaper.conf instead: wallpaper = ,/path/to/image.png
# (empty monitor name = applies to all monitors)

# Quickshell frost
# Hyprland matches namespace with RE2 full-match — need quickshell.* not ^(quickshell)
# ignore_alpha: skip blur only for near-clear pixels (rounded corners). Must be
# BELOW the glass alphas in theme.js (bar≈0.17, dock≈0.38, panels≈0.55).
# Syntax (0.50+): effect args without "=", match:namespace <regex>
blurls = quickshell
blurls = quickshell:dock
blurls = quickshell:notifs
blurls = quickshell:launcher
blurls = quickshell:emoji

layerrule = blur on, xray off, ignore_alpha 0.08, match:namespace ^(quickshell.*)$
layerrule = blur_popups on, match:namespace ^(quickshell.*)$
layerrule = blur off, match:namespace ^(quickshell:.*-dismiss)$
layerrule = blur off, match:namespace ^(quickshell:mixer-strip)$

