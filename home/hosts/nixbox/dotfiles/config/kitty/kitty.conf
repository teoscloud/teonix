font_family      3270 Nerd Font Mono
bold_font        auto
italic_font      auto
# 3270 has a 0.55 em cap height where most monos sit near 0.70, so it reads two
# to three points smaller than its size suggests — hence 22 rather than 15.
font_size        22.0
# The patched face carries the prompt glyphs itself, so no symbol_map: powerline
# separators are then generated at 3270's own advance width and baseline.
background_opacity 0.8
foreground       #D8DEE9
background       #21242e
selection_background #4C566A
cursor           #D8DEE9
active_tab_foreground #D8DEE9
active_tab_background #3B4252
inactive_tab_foreground #D8DEE9
inactive_tab_background #21242e
tab_bar_background #21242e
bell_on_tab      0
confirm_os_window_close     0
touch_scroll_multiplier 10.0

shell zsh
