# Mainframe Hyprland decoration (applied via qsmainframe; restored by qsglass)
# Window shape: 45° corner cuts (rounding_power 1 = triangular, not round).
# Hyprland applies the cut to all four corners.

decoration {
    rounding = 9
    rounding_power = 1
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

general {
    border_size = 1
    col.active_border = rgba(2a2e34ee) rgba(fffffff0) 45deg
    col.inactive_border = rgba(9aa0a8aa)
}

bezier = mfEase, 0.16, 1, 0.3, 1
bezier = linear, 0.0, 0.0, 1.0, 1.0
animation = windowsIn, 1, 4, mfEase, popin 55%
animation = windowsOut, 1, 3, mfEase, popin 55%
animation = windows, 1, 4, mfEase, popin 55%
# Glass used 30 (~3s/rev). 22 ≈ 2.2s/rev.
animation = borderangle, 1, 22, linear, loop
