# Pinned floating windows: distinct border color (amber/gold) so they stand out
windowrule = border_color rgb(F57676) rgb(F58B76), match:pin 1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# custom binds

# screenshot utils
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# system essentials
bind = $mainMod, O, exec, wlogout
bind = $mainMod, L, exec, sh /home/teodor/.config/hypr/listentomb.sh
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/audio-transmit-toggle.sh ssh
#bind = $mainMod SHIFT, semicolon, exec, ~/.config/hypr/scripts/audio-transmit-toggle.sh udp

#bind = $mainMod, S, exec, hyprctl keyword monitor "DP-1, 5120x1440@239.58, 0x0, 1, bitdepth, 8, vrr, 1" && hyprctl keyword monitor "DP-2, 1920x1080@60.00000, 1600x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60.00000, 5120x-120, 1, transform, 1"
bind = $mainMod, S, exec, hyprctl keyword monitor "DP-1, 5120x1440@60, 0x0, 1, bitdepth, 8" && hyprctl keyword monitor "DP-2, 1920x1080@60, 1600x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60, 5120x-120, 1, transform, 1"
bind = $mainMod, D, exec, hyprctl keyword monitor "DP-1, 2560x1440@120, 0x0, 1, bitdepth, 8" && hyprctl keyword monitor "DP-2, 1920x1080@60, 320x-1080, 1, bitdepth, 8" && hyprctl keyword monitor "HDMI-A-2, 1920x1080@60, 2560x0, 1, transform, 1"

bind = $mainMod, SPACE, exec, wofi --show drun
#bind = $mainMod, SPACE, exec, wofi --show drun
bind = $mainMod, grave, exec, wofi-emoji --show drun

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, kitty
bind = $mainMod, Q, killactive, 
bind = $mainMod, N, exec, codium ~/myprojects/teonix-unstable/ && codium ~/.config/
#bind = $mainMod, M, exec, 
#bind = $mainMod, V, togglefloating, 
bind = $mainMod, C, exec, hyprctl dispatch togglefloating && hyprctl dispatch centerwindow
bind = $mainMod, P, pin
#bind = $mainMod, J, togglesplit, # dwindle

bind = $mainMod SHIFT, F, exec, hyprctl dispatch fullscreen

# Scrolling layout: swap active window's column with neighbor right/left
bind = $mainMod, TAB, layoutmsg, swapcol r
bind = $mainMod SHIFT, TAB, layoutmsg, swapcol l
# bind = $mainMod, TAB, exec, sh /home/teodor/.config/hypr/cyclemon.sh  # was here; moved to layoutmsg swapcol

bind = $mainMod ALT, C, exec, mpv av://v4l2:/dev/video1

#bind = $mainMod, S, exec, hyprctl keyword input:kb_layout se
bind = $mainMod, R, exec, obsidian &
#bind = $mainMod, A, exec, hyprctl keyword input:kb_layout us

# Move focus with mainMod + arrow keys (layoutmsg focus for scrolling layout; works in-column and wraps)
bind = $mainMod, left, layoutmsg, focus l
bind = $mainMod, right, layoutmsg, focus r
bind = $mainMod, up, layoutmsg, focus u
bind = $mainMod, down, layoutmsg, focus d

bind = $mainMod ALT, a, layoutmsg, focus l
bind = $mainMod ALT, d, layoutmsg, focus r
bind = $mainMod ALT, w, layoutmsg, focus u
bind = $mainMod ALT, s, layoutmsg, focus d

bind = $mainMod, b, exec, blueman-manager
bind = $mainMod, v, exec, looking-glass-client -m KEY_GRAVE

bind = $mainMod, u, exec, nordvpn d && nordvpn set killswitch off
bind = $mainMod, i, exec, nordvpn connect stockholm && nordvpn set killswitch on
bind = $mainMod SHIFT, i, exec, nordvpn connect us && nordvpn set killswitch on

#bind = $mainMod, D, exec, ~/.config/hypr/dragonscripts/dragon-source.sh
#bind = $mainMod SHIFT, D, exec, ~/.config/hypr/dragonscripts/dragon-target.sh

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, Z, workspace, 11
bind = $mainMod, X, workspace, 12
bind = $mainMod, A, workspace, 13
bind = $mainMod, G, workspace, 14
bind = $mainMod, W, workspace, 15
bind = $mainMod, E, workspace, 16

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, Z, movetoworkspace, 11
bind = $mainMod SHIFT, X, movetoworkspace, 12
bind = $mainMod SHIFT, A, movetoworkspace, 13
bind = $mainMod SHIFT, G, movetoworkspace, 14
bind = $mainMod SHIFT, W, movetoworkspace, 15
bind = $mainMod SHIFT, E, movetoworkspace, 16

#bind = $mainMod, mouse_up, layoutmsg, focus l
#bind = $mainMod, mouse_down, layoutmsg, focus r

# Scrolling layout: mainMod + scroll up/down = focus right/left (up = ascending = right)
bind = $mainMod, mouse:275, layoutmsg, focus l
bind = $mainMod, mouse:276, layoutmsg, focus r
# Scrolling layout: mainMod+Shift+mouse:276 = promote window to own column
bind = $mainMod SHIFT, mouse:276, layoutmsg, promote
# Workspace: mainMod + mouse back/forward (browser back/forward buttons)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scrolling layout keyboard: mainMod + comma/period = -col/+col
bind = $mainMod, comma, layoutmsg, focus l
bind = $mainMod, period, layoutmsg, focus r

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = ,XF86AudioRaiseVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = ,XF86AudioPlay, exec, playerctl play-pause
bind = ,XF86AudioPause, exec, playerctl play-pause
bind = ,XF86AudioNext, exec, playerctl next
bind = ,XF86AudioPrev, exec, playerctl previous
bind = ,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind = ,XF86MonBrightnessUp,exec,brightnessctl set +5%

