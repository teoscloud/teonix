# hyprland.conf
# source ~/.config/hypr/monitor.conf
#monitor = DP-1, 5120x1440@239.58, 0x0, 1, bitdepth, 8, vrr, 1
#start with ultrawide
#monitor = DP-1, 5120x1440@60, 0x0, 1, bitdepth, 8
#monitor = DP-2, 1920x1080@60, 1600x-1080, 1, bitdepth, 8
#monitor = HDMI-A-2, 1920x1080@60, 5120x-120, 1, transform, 1
#startwithnormal
monitor = DP-1, 2560x1440@120, 0x0, 1, bitdepth, 8
monitor = DP-2, 1920x1080@60, 320x-1080, 1, bitdepth, 8
monitor = HDMI-A-2, 1920x1080@60, 2560x0, 1, transform, 1

# ... rest of your hyprland configuration ...

# Environment variables
env = NIXOS_OZONE_WL, 1
env = NIXPKGS_ALLOW_UNFREE, 1
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = GDK_BACKEND, wayland,x11
env = CLUTTER_BACKEND, wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
#env = SDL_VIDEODRIVER, x11
#env = SDL_VIDEODRIVER, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = WLR_XCURSOR_SIZE, 24 # Added for Wayland cursor size
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, macOS
env = WLR_XCURSOR_THEME, macOS
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = HYPRCURSOR_SIZE, 24


exec-once = hyprctl setcursor macOS 24

# Autostart applications
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Wallpaper: hyprpaper only (swww + hyprpaper together is redundant and extra compositor load)
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = lxqt-policykit-agent
exec-once = brightnessctl set 100%
exec-once = brightnessctl -d *::kbd_backlight set 100%
exec-once = gammastep -O 7500
exec-once = hyprpaper
exec-once = hypridle &
# hyprlux: started by NixOS module (programs.hyprlux); do not exec-once here (double-start causes conflicts)
exec-once = blueman-applet &
exec-once = easyeffects -l "sub testing"
exec-once = gsettings set org.gnome.desktop.wm.preferences audible-bell false
#exec-once = /usr/lib/polkit-kde-authentication-agent-1

exec-once = flatpak override --filesystem=~/.themes:ro --filesystem=~/.icons:ro --user

exec = gsettings set org.gnome.desktop.interface gtk-theme "WhiteSur-Dark"

exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark" 

#exec-once = corectrl

exec-once = signal-desktop &
exec-once = wasistlos &
exec-once = arrpc &
# udiskie: managed by Home Manager (tray=never); do NOT start here — tray popups crash Hyprland (CPopup::onCommit)
# exec-once = ~/.config/hypr/scripts/scrolling-promote-new-window.sh &  # disabled: promote via mainMod+Shift+mouse:276

# Disable middle-click paste
#bind = , mouse:274, exec, ;
#exec-once = wl-paste -p --watch wl-copy -p ''

ecosystem {
    no_update_news = true
}

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us,se
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    mouse_refocus = false

    force_no_accel = true

    touchpad {
        disable_while_typing=1
        natural_scroll=1
        clickfinger_behavior=1
        middle_button_emulation=0
        tap-to-click=0
        scroll_factor=0.2

    }
    
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border =  rgba(141417ee) rgba(FFFFFFee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = scrolling
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }

    #drop_shadow = yes
    #drop_shadow = no
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)
}

# Single animations block (duplicate blocks are confusing and can behave unpredictably)
animations {
    enabled = yes
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    animation = borderangle, 1, 30, linear, loop
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

scrolling {
    column_width = 0.66
    follow_focus = true
    follow_min_visible = 0
    focus_fit_method = 1
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    #new_is_master = true
    smart_resizing = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    # workspace_swipe = on
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

xwayland {
  force_zero_scaling = true;
}

experimental {
    #xx_color_management_v4 = true;
    #wide_color_gamut = true;
    #hdr = true;
}

# Wallpaper configuration is handled by hyprpaper (see hyprpaper.conf)
# Hyprland no longer supports direct wallpaper configuration in this file
# Use hyprpaper.conf instead: wallpaper = ,/path/to/image.png
# (empty monitor name = applies to all monitors)

