general {
    # lock_cmd = notify-send "lock!"          # dbus/sysd lock command (loginctl lock-session) 
    # unlock_cmd = notify-send "unlock!"      # same as above, but unlock
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    lock_cmd = pidof hyprlock || hyprlock # avoid starting multiple hyprlock instances.
    # These hook logind's PrepareForSleep, so they fire for *every* suspend, not
    # only idle-triggered ones. Dropping to a single output at a validated mode
    # before sleeping means the resume modeset is the least demanding one possible;
    # restore puts the layout back and falls back to safe mode if it cannot.
    # See hosts/mainframe/GPU.md.
    before_sleep_cmd = loginctl lock-session && $HOME/.config/hypr/scripts/display-safe.sh save-and-deescalate
    after_sleep_cmd = hyprctl dispatch dpms on && $HOME/.config/hypr/scripts/display-safe.sh restore
}

# Screenlock
listener {
    timeout = 18000                            # in seconds
    on-timeout = waydroid session stop && hyprlock # command to run when timeout has passed
}

