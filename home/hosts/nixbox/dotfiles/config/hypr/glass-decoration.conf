# Glass rice decoration restore (qsglass)
decoration {
    rounding = 10
    shadow {
        enabled = true
    }
    blur {
        enabled = true
    }
}

general {
    border_size = 1
}

bezier = myBezier, 0.05, 0.9, 0.1, 1.05
animation = windows, 1, 7, myBezier
animation = windowsOut, 1, 7, default, popin 80%
