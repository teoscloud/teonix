# OPTIONAL alternate path: denoise *playback to* the PCM2902 DAC
# (apps → EEDN → PCM2902). Prefer eedn-pcm2902-mic.conf for mic listen.

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level   = -11
          rt.prio      = 88
          rt.time.soft = 200000
          rt.time.hard = 200000
      }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }

    { name = libpipewire-module-filter-chain
      args = {
          node.description = "EEDN Denoiser Sink"
          media.name       = "EEDN Denoiser Sink"
          filter.graph = {
              nodes = [
                  {
                      type   = ladspa
                      name   = eedn
                      plugin = eedn_denoiser
                      label  = eedn_denoiser
                      control = {
                          "Threshold (dB)"    = -48.0
                          "Range Band 1 (dB)" = 8.0
                          "Range Band 2 (dB)" = 9.0
                          "Range Band 3 (dB)" = 7.0
                          "Range Band 4 (dB)" = 8.0
                          "Range Band 5 (dB)" = 12.0
                          "Range Band 6 (dB)" = 14.0
                          "HF Bias"           = 0.35
                          "Stereo Link"       = 0.85
                          "Bypass"            = 0.0
                      }
                  }
              ]
          }
          capture.props = {
              node.name      = "eedn_denoise_sink"
              node.description = "EEDN Denoiser Sink"
              media.class    = Audio/Sink
              audio.channels = 2
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name      = "eedn_denoise_to_pcm2902"
              node.description = "EEDN → PCM2902"
              media.class    = Stream/Output/Audio
              node.passive   = true
              audio.channels = 2
              audio.position = [ FL FR ]
              target.object  = "alsa_output.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo-output"
          }
      }
    }
]
