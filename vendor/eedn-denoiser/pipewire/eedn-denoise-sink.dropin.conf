# Drop-in for ~/.config/pipewire/pipewire.conf.d/ (loads inside the PipeWire server)
# Prefer the standalone filter-chain file if you want an isolated process.

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "EEDN Denoiser Sink"
          media.name       = "EEDN Denoiser Sink"
          filter.graph = {
              nodes = [
                  {
                      type   = ladspa
                      name   = eedn
                      plugin = eedn_denoiser
                      label  = eedn_denoiser
                      control = {
                          "Threshold (dB)"    = -48.0
                          "Range Band 1 (dB)" = 8.0
                          "Range Band 2 (dB)" = 9.0
                          "Range Band 3 (dB)" = 7.0
                          "Range Band 4 (dB)" = 8.0
                          "Range Band 5 (dB)" = 12.0
                          "Range Band 6 (dB)" = 14.0
                          "HF Bias"           = 0.35
                          "Stereo Link"       = 0.85
                          "Bypass"            = 0.0
                      }
                  }
              ]
          }
          capture.props = {
              node.name      = "eedn_denoise_sink"
              media.class    = Audio/Sink
              audio.channels = 2
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name   = "eedn_denoise_playback"
              node.passive = true
              audio.channels = 2
              audio.position = [ FL FR ]
          }
      }
    }
]
