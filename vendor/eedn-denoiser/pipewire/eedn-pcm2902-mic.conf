# Denoise the PCM2902 microphone, then hand off to Easy Effects.
# Preset: default (live tuner session).

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level   = -11
          rt.prio      = 88
          rt.time.soft = 200000
          rt.time.hard = 200000
      }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }

    { name = libpipewire-module-filter-chain
      args = {
          node.description = "EEDN PCM2902 Mic"
          media.name       = "EEDN PCM2902 Mic"
          filter.graph = {
              nodes = [
                  {
                      type   = ladspa
                      name   = eedn
                      plugin = eedn_denoiser
                      label  = eedn_denoiser
                      control = {
                          "Threshold (dB)"     = -71.4583
                          "Range Band 1 (dB)"  = 12
                          "Range Band 2 (dB)"  = 11.5
                          "Range Band 3 (dB)"  = 8
                          "Range Band 4 (dB)"  = 14
                          "Range Band 5 (dB)"  = 12.5115
                          "Range Band 6 (dB)"  = 8.8918
                          "Band 1 Freq (Hz)"   = 120
                          "Band 2 Freq (Hz)"   = 240
                          "Band 3 Freq (Hz)"   = 600
                          "Band 4 Freq (Hz)"   = 1580
                          "Band 5 Freq (Hz)"   = 3000
                          "Band 6 Freq (Hz)"   = 12000
                          "HF Bias"            = 0.4
                          "Stereo Link"        = 0.9
                          "Bypass"             = 0.0
                      }
                  }
              ]
          }
          capture.props = {
              node.name        = "eedn_pcm2902_capture"
              node.description = "EEDN ← PCM2902 mic"
              media.class      = "Stream/Input/Audio"
              audio.channels   = 2
              audio.position   = [ FL FR ]
              target.object    = "alsa_input.usb-Burr-Brown_from_TI_USB_Audio_CODEC-00.analog-stereo-input"
              stream.dont-remix = true
          }
          playback.props = {
              node.name        = "eedn_pcm2902_playback"
              node.description = "EEDN PCM2902 (denoised)"
              media.name       = "EEDN PCM2902 (denoised)"
              media.class      = "Stream/Output/Audio"
              audio.channels   = 2
              audio.position   = [ FL FR ]
              target.object    = "easyeffects_sink"
              node.passive     = true
          }
      }
    }
]
